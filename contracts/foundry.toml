[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{access = "read", path = "./"}, {access = "read-write", path = "./out"}, {access = "read-write", path = "../shared"}]

[rpc_endpoints]
rhc = "https://rpc.mainnet.chain.robinhood.com"
local = "http://127.0.0.1:8547"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
