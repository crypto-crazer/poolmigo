name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  build-and-test:
    name: Build + unit/integration tests (no fork)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Format check
        run: forge fmt --check

      - name: Build (with sizes)
        run: forge build --sizes

      - name: Clean build info (OZ upgrades plugin requirement)
        run: forge clean

      - name: Run non-fork tests
        run: |
          forge build
          forge test --no-match-path 'test/fork/*' -vv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slither
        run: pip install slither-analyzer

      - name: Build
        run: forge build

      - name: Run slither
        run: slither . --config-file slither.config.json

  aderyn:
    name: Aderyn static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Install aderyn
        run: |
          curl -sL -o aderyn.tar.xz https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          curl -sL -o aderyn.sha256 https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz.sha256
          echo "$(awk '{print $1}' aderyn.sha256)  aderyn.tar.xz" | sha256sum -c -
          tar xf aderyn.tar.xz
          sudo mv aderyn-x86_64-unknown-linux-gnu/aderyn /usr/local/bin/

      - name: Build
        run: forge build

      - name: Run aderyn
        run: aderyn --output aderyn-report.md

      - name: Upload aderyn report
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md